- changeSet:
    id: 1
    author: newlife
    changes:
      - createTable:
          tableName: users-tb
          columns:
            - column:
                name: id
                type: BIGINT
            - column:
                name: name
                type: VARCHAR(255)
            - column:
                name: username
                type: VARCHAR(255)
            - column:
                name: email
                type: VARCHAR(255)
            - column:
                name: phone
                type: VARCHAR(255)
            - column:
                name: created_at
                type: TIMESTAMP
            - column:
                name: updated_at
                type: TIMESTAMP
            - column:
                name: created_by
                type: VARCHAR(255)
            - column:
                name: updated_by
                type: VARCHAR(255)
            - column:
                name: is_active
                type: CHAR(1)
            - column:
                name: password
                type: VARCHAR(255)

      - createTable:
          tableName: roles-tb
          columns:
            - column:
                name: role_id
                type: BIGINT
            - column:
                name: role_name
                type: VARCHAR(255)
            - column:
                name: created_at
                type: TIMESTAMP
            - column:
                name: updated_at
                type: TIMESTAMP
            - column:
                name: created_by
                type: VARCHAR(255)
            - column:
                name: updated_by
                type: VARCHAR(255)
            - column:
                name: is_active
                type: CHARACTER(1)

      - createTable:
          tableName: codes-tb
          columns:
            - column:
                name: id
                type: BIGINT
            - column:
                name: code_name
                type: VARCHAR(255)
            - column:
                name: start_date
                type: TIMESTAMP
            - column:
                name: expiry_date
                type: TIMESTAMP
            - column:
                name: created_at
                type: TIMESTAMP
            - column:
                name: updated_at
                type: TIMESTAMP
            - column:
                name: created_by
                type: VARCHAR(255)
            - column:
                name: updated_by
                type: VARCHAR(255)
            - column:
                name: is_active
                type: CHARACTER(1)
            - column:
                name: reward
                type: VARCHAR(5)